name: CIKO BUILD APK

on:
  # Otomatis jalan tiap ada upload / commit ke repo (tidak perlu tekan Run workflow).
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  # Tetap bisa dijalankan manual dari tab Actions.
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Nama ZIP project (kosongkan = otomatis deteksi)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

# Upload lewat web GitHub sering jadi beberapa commit berurutan:
# build yang lama dibatalkan, hanya commit terakhir (file sudah lengkap) yang dibangun.
concurrency:
  group: ciko-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Tunggu upload selesai
        run: sleep 20

      - name: Detect project source
        shell: bash
        run: |
          # Urutan: input manual -> source.zip -> project.zip -> ZIP pertama di root -> repo ini sendiri.
          ZIP_NAME="${{ inputs.source_zip }}"
          if [ -z "$ZIP_NAME" ]; then
            for c in source.zip project.zip; do
              [ -f "$c" ] && ZIP_NAME="$c" && break
            done
          fi
          if [ -z "$ZIP_NAME" ]; then
            ZIP_NAME="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort | head -n 1)"
          fi

          if [ -n "$ZIP_NAME" ]; then
            test -f "$ZIP_NAME" || { echo "::error::File $ZIP_NAME tidak ditemukan di repo."; exit 1; }
            echo "Sumber: ZIP $ZIP_NAME"
            mkdir -p _ciko_source
            unzip -q "$ZIP_NAME" -d _ciko_source
            SEARCH_DIR="_ciko_source"
          else
            echo "Sumber: isi repo ini langsung (tidak ada ZIP)"
            SEARCH_DIR="."
          fi

          PROJECT_ROOT="$(find "$SEARCH_DIR" -maxdepth 4 -name pubspec.yaml -not -path '*/.*/*' -not -path '*/_ciko_source/_ciko_source/*' -printf '%h\n' | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="$(find "$SEARCH_DIR" -maxdepth 4 -name gradlew -not -path '*/.*/*' -printf '%h\n' | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)"
          fi
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Tidak ada project (pubspec.yaml / gradlew) di repo ataupun di dalam ZIP. Upload semua file project dulu."
            find "$SEARCH_DIR" -maxdepth 3 -type f -not -path './.git/*' | head -100
            exit 1
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_ROOT"

      - name: Detect project type and install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Copy project into workspace
        shell: bash
        run: |
          if [ "$PROJECT_ROOT" != "." ]; then
            cp -a "$PROJECT_ROOT"/. .
            echo "Project disalin ke workspace"
          else
            echo "Project sudah ada di root repo"
          fi

      - name: Build Flutter APK
        if: hashFiles('pubspec.yaml') != ''
        run: |
          flutter --version
          retry() { n=1; until "$@"; do [ "$n" -ge 3 ] && return 1; echo "::warning::Percobaan $n gagal, mengulang..."; sleep $((n*30)); n=$((n+1)); done; }
          mkdir -p "$HOME/.gradle/init.d"; [ -f android/ciko-mirror.init.gradle ] && cp android/ciko-mirror.init.gradle "$HOME/.gradle/init.d/" || true
          retry flutter pub get
          # APK dipisah per-ABI + simbol debug dibuang => tiap APK jauh lebih kecil (target < 10 MB)
          retry flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --split-debug-info=build/symbols || {
            echo "::warning::Build split-per-abi gagal, mencoba build biasa"
            flutter build apk --release --split-debug-info=build/symbols
          }

      - name: Build Android Studio APK
        if: hashFiles('pubspec.yaml') == '' && hashFiles('gradlew') != ''
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p ciko-output
          find . -type f -name '*.apk' -path '*/outputs/*' -not -path './ciko-output/*' -exec cp {} ciko-output/ \;
          if [ -z "$(find ciko-output -name '*.apk' -print -quit)" ]; then
            echo "::error::APK tidak ditemukan. Periksa log job Build Flutter APK / Build Android Studio APK."
            exit 1
          fi
          ls -lh ciko-output
          for f in ciko-output/*.apk; do
            SIZE=$(stat -c%s "$f")
            echo "$(basename "$f"): $((SIZE / 1024 / 1024)) MB"
            if [ "$SIZE" -gt 10485760 ]; then
              echo "::warning::$(basename "$f") berukuran lebih dari 10 MB"
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CIKO-APK
          path: ciko-output/*.apk
          if-no-files-found: error
          retention-days: 90
