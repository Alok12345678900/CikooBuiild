name: ciko_build
description: CIKO BUILD - upload file ke GitHub lalu build APK lewat GitHub Actions.
publish_to: 'none'
version: 2.0.0+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.4
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.7
  battery_plus: ^6.0.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  dio: ^5.7.0
  connectivity_plus: ^6.1.4
  archive: ^3.6.1
  permission_handler: ^11.3.1
  font_awesome_flutter: ^11.0.0
  google_sign_in: ^6.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/workflows/

