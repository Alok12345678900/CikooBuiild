name: Build Android Native APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Mode build"
        required: true
        type: choice
        default: release
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delay (untuk tracking)
        run: sleep 15

      - name: Extract project.zip
        shell: bash
        run: |
          if [ ! -f project.zip ]; then
            echo "::error::project.zip tidak ditemukan"
            exit 1
          fi
          unzip -q project.zip -d project_raw

      - name: Detect Project Root
        shell: bash
        run: |
          GRADLEW=$(find project_raw -type f -name "gradlew" -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          retry() {
            n=1
            until "$@"; do
              if [ "$n" -ge 3 ]; then return 1; fi
              echo "::warning::Percobaan $n gagal (mungkin 429 dari Maven Central), mengulang dalam $((n*30)) detik..."
              sleep $((n*30)); n=$((n+1))
            done
          }
          mkdir -p "$HOME/.gradle/init.d"
          if [ -f android/ciko-mirror.init.gradle ]; then cp android/ciko-mirror.init.gradle "$HOME/.gradle/init.d/"; fi
          if [ -f ciko-mirror.init.gradle ]; then cp ciko-mirror.init.gradle "$HOME/.gradle/init.d/"; fi
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            retry ./gradlew assembleDebug --no-daemon --stacktrace
          else
            retry ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Find and sign APK
        shell: bash
        run: |
          set -e
          mapfile -t APKS < <(find "$GITHUB_WORKSPACE/project_raw" -type f -name "*.apk" -not -iname "*androidTest*" | sort)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::APK tidak ditemukan. Periksa log langkah Build APK."
            exit 1
          fi
          APK=""
          for f in "${APKS[@]}"; do
            case "$f" in
              *unsigned*) ;;
              *) APK="$f"; break ;;
            esac
          done
          if [ -z "$APK" ]; then APK="${APKS[0]}"; fi
          echo "APK dipilih: $APK"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if ! "$BT/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo "APK belum ditandatangani -> tanda tangani dengan debug key supaya bisa diinstal"
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" \
              --ks-pass pass:android --key-pass pass:android \
              --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
            APK="$RUNNER_TEMP/signed.apk"
          fi

          mkdir -p "$GITHUB_WORKSPACE/ciko-output"
          cp "$APK" "$GITHUB_WORKSPACE/ciko-output/app-${{ inputs.build_type }}.apk"
          ls -lh "$GITHUB_WORKSPACE/ciko-output"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_type }}
          path: ciko-output/*.apk
          if-no-files-found: error
          retention-days: 3
